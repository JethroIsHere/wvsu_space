name: Delete expired / old Gratitude posts

on:
  schedule:
    # run every 15 minutes (adjust as needed)
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Consider posts older than this many minutes (timestamp field)'
        required: false
        default: '30'
      force:
        description: 'Set to "true" to actually delete documents. Default is dry-run.'
        required: false
        default: 'false'

jobs:
  delete-expired-posts:
    runs-on: ubuntu-latest
    name: Delete expired / old posts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies for scripts
        working-directory: ./scripts
        run: |
          # ensure a package.json exists or just install firebase-admin locally
          if [ -f package.json ]; then
            npm ci
          else
            npm init -y
            npm install firebase-admin
          fi

      - name: Create service account file
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo 'Missing FIREBASE_SERVICE_ACCOUNT secret' >&2
            exit 1
          fi
          printf '%s' "$SA_JSON" > ./scripts/service-account.json
          chmod 600 ./scripts/service-account.json

      - name: Run delete script (dry-run or force)
        working-directory: ./
        run: |
          MINUTES_INPUT='${{ github.event.inputs.minutes }}'
          MINUTES=${MINUTES_INPUT:-30}
          FORCE_INPUT='${{ github.event.inputs.force }}'
          ARGS=("--key" "./scripts/service-account.json" "--minutes" "$MINUTES")
          if [ "$FORCE_INPUT" = 'true' ]; then
            ARGS+=("--force")
          fi
          echo "Running delete_old_posts_cli.js with: ${ARGS[*]}"
          node ./scripts/delete_old_posts_cli.js "${ARGS[@]}"
